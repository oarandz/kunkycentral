<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>The Kunky Economy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
  :root{
    --ink:#181B23; --ink-soft:#3A3F4B; --muted:#717784; --faint:#9AA0AC;
    --canvas:#EEF1F4; --card:#FFFFFF; --line:#E4E7EC; --line-soft:#EEF0F3;
    --brand:#0E7C66; --brand-ink:#0A5C4C;
    --pos:#1DAA6B; --pos-soft:#E6F6EF;
    --neg:#E5564B; --neg-soft:#FCEBE9;
    --shadow:0 1px 2px rgba(16,24,40,.04), 0 8px 24px rgba(16,24,40,.06);
    --shadow-lg:0 12px 40px rgba(16,24,40,.16);
    --r:16px; --r-sm:11px; --r-lg:22px;
    --display:'Space Grotesk',system-ui,sans-serif;
    --body:'Inter',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:var(--body); color:var(--ink); background:var(--canvas);
    -webkit-font-smoothing:antialiased; line-height:1.45;
    overflow-x:hidden;
  }
  .num{font-family:var(--display); font-feature-settings:"tnum" 1; letter-spacing:-.01em}
  button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit}
  input,textarea,select{font-family:inherit; font-size:16px; color:var(--ink)}
  :focus-visible{outline:2px solid var(--brand); outline-offset:2px; border-radius:6px}
  ::selection{background:#0E7C6633}

  /* ---------- App frame ---------- */
  #app{max-width:560px; margin:0 auto; min-height:100dvh; display:flex; flex-direction:column}

  .topbar{
    position:sticky; top:0; z-index:30; background:rgba(238,241,244,.85);
    backdrop-filter:saturate(1.4) blur(12px); -webkit-backdrop-filter:saturate(1.4) blur(12px);
    padding:14px 18px 12px; display:flex; align-items:center; gap:12px;
    border-bottom:1px solid var(--line);
  }
  .wordmark{font-family:var(--display); font-weight:700; font-size:17px; letter-spacing:-.02em; display:flex; align-items:center; gap:8px; white-space:nowrap}
  .wordmark .dot{width:10px; height:10px; border-radius:50%; background:var(--brand); box-shadow:0 0 0 4px #0E7C6622}
  .topbar .spacer{flex:1}
  .me-chip{display:flex; align-items:center; gap:8px; background:var(--card); border:1px solid var(--line);
    padding:5px 11px 5px 5px; border-radius:999px; font-weight:600; font-size:13px; box-shadow:var(--shadow)}
  .me-chip:active{transform:scale(.97)}
  .icon-btn{width:38px; height:38px; border-radius:50%; background:var(--card); border:1px solid var(--line); display:grid; place-items:center; color:var(--muted); box-shadow:var(--shadow)}
  .icon-btn svg{width:19px; height:19px}
  .icon-btn:active{transform:scale(.95)}
  .icon-btn.active{color:var(--brand); border-color:var(--brand)}
  .note{display:flex; gap:9px; align-items:flex-start; background:#0E7C6608; border:1px solid #0E7C6622; border-radius:var(--r-sm); padding:11px 13px; font-size:12.5px; color:var(--ink-soft); line-height:1.5; margin-top:14px}
  .note .ni{flex:none; font-size:14px; line-height:1.3}
  .tag-pill{display:inline-flex; align-items:center; gap:5px; background:#8B5CF614; color:#6D28D9; border:1px solid #8B5CF633; padding:2px 9px; border-radius:999px; font-size:11.5px; font-weight:600; vertical-align:middle}
  .tag-pill .x{font-size:11px; opacity:.7}
  .chip-scroll{display:flex; gap:8px; overflow-x:auto; padding:2px 0 10px; margin:0 -18px 4px; padding-left:18px; padding-right:18px; -webkit-overflow-scrolling:touch; scrollbar-width:none}
  .chip-scroll::-webkit-scrollbar{display:none}
  .fchip{flex:none; padding:7px 14px; border-radius:999px; border:1px solid var(--line); background:var(--card); font-size:13px; font-weight:600; color:var(--muted); white-space:nowrap; box-shadow:var(--shadow)}
  .fchip.on{background:var(--ink); color:#fff; border-color:var(--ink)}

  main{flex:1; padding:18px 18px 110px}

  /* ---------- Connection banner ---------- */
  .conn{background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:14px 16px; margin-bottom:16px; box-shadow:var(--shadow)}
  .conn.ok{border-color:#1DAA6B55; background:var(--pos-soft)}
  .conn-head{display:flex; align-items:center; gap:10px; cursor:pointer}
  .conn-head h3{font-size:14px; font-weight:600}
  .conn-head .status{margin-left:auto; font-size:12px; font-weight:600; color:var(--muted); display:flex; align-items:center; gap:6px}
  .conn-head .status .led{width:8px; height:8px; border-radius:50%; background:var(--neg)}
  .conn.ok .status .led{background:var(--pos)}
  .conn-body{margin-top:12px}
  .conn p{font-size:13px; color:var(--muted); margin-bottom:10px; line-height:1.5}
  .conn .row{display:flex; gap:8px}
  .conn input{flex:1; padding:11px 13px; border:1px solid var(--line); border-radius:var(--r-sm); background:#fff}

  /* ---------- Avatars ---------- */
  .av{display:inline-flex; align-items:center; justify-content:center; border-radius:50%; color:#fff;
    font-weight:600; font-family:var(--body); flex:none; line-height:1}
  .av.sm{width:30px; height:30px; font-size:12px}
  .av.md{width:40px; height:40px; font-size:15px}
  .av.lg{width:58px; height:58px; font-size:21px}

  /* ---------- Buttons ---------- */
  .btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; font-weight:600; font-size:15px;
    padding:13px 18px; border-radius:var(--r-sm); transition:transform .08s ease, background .15s ease, box-shadow .15s}
  .btn:active{transform:scale(.98)}
  .btn-primary{background:var(--brand); color:#fff; box-shadow:0 1px 2px rgba(14,124,102,.4), 0 6px 16px rgba(14,124,102,.22)}
  .btn-primary:hover{background:var(--brand-ink)}
  .btn-primary:disabled{background:#C7CDD4; box-shadow:none; cursor:not-allowed; color:#fff}
  .btn-ghost{background:var(--card); border:1px solid var(--line); color:var(--ink); box-shadow:var(--shadow)}
  .btn-ghost:hover{border-color:#cfd4db}
  .btn-block{width:100%}
  .btn-sm{padding:9px 13px; font-size:13px; border-radius:9px}

  /* ---------- Cards / sections ---------- */
  .card{background:var(--card); border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--shadow)}
  .section-eyebrow{font-size:11px; font-weight:600; letter-spacing:.12em; text-transform:uppercase; color:var(--faint); margin:2px 0 12px}
  .page-title{font-family:var(--display); font-weight:700; font-size:26px; letter-spacing:-.025em; margin-bottom:2px}
  .page-sub{font-size:14px; color:var(--muted); margin-bottom:20px}

  /* ---------- Forms ---------- */
  .field{margin-bottom:16px}
  .field label{display:block; font-size:13px; font-weight:600; color:var(--ink-soft); margin-bottom:7px}
  .field .hint{font-weight:400; color:var(--faint)}
  .input, textarea.input, select.input{width:100%; padding:13px 14px; border:1px solid var(--line); border-radius:var(--r-sm);
    background:#fff; transition:border .15s, box-shadow .15s}
  .input:focus, textarea.input:focus, select.input:focus{outline:none; border-color:var(--brand); box-shadow:0 0 0 3px #0E7C661f}
  textarea.input{resize:vertical; min-height:70px; line-height:1.5}
  .money-input{position:relative}
  .money-input .sym{position:absolute; left:14px; top:50%; transform:translateY(-50%); color:var(--muted); font-weight:600; font-family:var(--display)}
  .money-input input{padding-left:30px; font-family:var(--display); font-size:18px; font-weight:600}

  /* segmented control */
  .seg{display:flex; background:var(--canvas); border:1px solid var(--line); border-radius:var(--r-sm); padding:4px; gap:4px}
  .seg button{flex:1; padding:9px; border-radius:8px; font-size:13.5px; font-weight:600; color:var(--muted); transition:.15s}
  .seg button.active{background:#fff; color:var(--ink); box-shadow:var(--shadow)}

  /* person picker chips */
  .people-grid{display:flex; flex-wrap:wrap; gap:8px}
  .pchip{display:inline-flex; align-items:center; gap:8px; padding:6px 13px 6px 6px; border-radius:999px;
    border:1.5px solid var(--line); background:#fff; font-size:14px; font-weight:600; color:var(--ink-soft); transition:.12s}
  .pchip:active{transform:scale(.96)}
  .pchip.on{border-color:var(--brand); background:#0E7C660d; color:var(--ink)}
  .pchip .tick{margin-left:2px; color:var(--brand); opacity:0; transition:.12s; font-size:13px}
  .pchip.on .tick{opacity:1}

  .split-row{display:flex; align-items:center; gap:11px; padding:10px 0; border-bottom:1px solid var(--line-soft)}
  .split-row:last-child{border-bottom:none}
  .split-row .name{flex:1; font-weight:500; font-size:14.5px}
  .split-row .amt{width:104px}
  .stepper{display:inline-flex; align-items:center; gap:2px; background:var(--canvas); border:1px solid var(--line); border-radius:9px; padding:2px; margin-right:10px}
  .stepper button{width:26px; height:26px; border-radius:7px; font-size:16px; font-weight:600; color:var(--ink-soft); display:grid; place-items:center}
  .stepper button:active{background:#fff}
  .stepper .st-v{min-width:22px; text-align:center; font-weight:600; font-family:var(--display); font-size:14px}
  .rest-btn{font-size:11px; font-weight:600; color:var(--muted); background:var(--canvas); border:1px solid var(--line); border-radius:7px; padding:5px 9px; margin-right:10px}
  .rest-btn.on{background:#0E7C660d; border-color:var(--brand); color:var(--brand)}
  .seg-4 button{font-size:12.5px; padding:9px 4px}
  .pct-row{padding:12px 2px; border-bottom:1px solid var(--line-soft)}
  .pct-row:last-child{border-bottom:none}
  .pct-head{display:flex; align-items:center; gap:9px; margin-bottom:9px}
  .pct-lock{width:28px; height:28px; border-radius:8px; background:var(--canvas); border:1px solid var(--line); display:grid; place-items:center; font-size:12px; flex:none}
  .pct-lock.on{background:#0E7C660d; border-color:var(--brand)}
  .pct-mini{display:inline-flex; align-items:center; gap:3px; font-size:12px; color:var(--muted); font-weight:600; flex:none}
  .numbox{display:inline-flex; align-items:stretch; border:1px solid var(--line); border-radius:8px; overflow:hidden; background:#fff; height:32px}
  .numbox:focus-within{border-color:var(--brand); box-shadow:0 0 0 3px #0E7C661f}
  .pct-in{width:38px; padding:0 6px; border:none; text-align:right; font-family:var(--display); font-weight:600; font-size:13px; background:transparent; color:var(--ink)}
  .numbox.amt .pct-in{width:48px}
  .pct-in:focus{outline:none}
  .pct-in:disabled{color:var(--faint)}
  .pct-in::-webkit-outer-spin-button, .pct-in::-webkit-inner-spin-button{-webkit-appearance:none; margin:0}
  .pct-in[type=number]{-moz-appearance:textfield; appearance:textfield}
  .nstep{display:flex; flex-direction:column; border-left:1px solid var(--line); flex:none}
  .nstep button{width:18px; flex:1; display:grid; place-items:center; font-size:7px; color:var(--muted); background:var(--canvas); line-height:1; padding:0}
  .nstep button:first-child{border-bottom:1px solid var(--line)}
  .nstep button:active{background:var(--line); color:var(--ink)}
  .nstep button:disabled{opacity:.4}
  .numbox.amt .nstep{opacity:1}
  .pct-row.locked .name{color:var(--muted)}
  .pct-row.locked .numbox{background:var(--canvas)}
  .pct-slider{-webkit-appearance:none; appearance:none; width:100%; height:6px; border-radius:99px; background:var(--line); outline:none; cursor:pointer}
  .pct-slider:disabled{opacity:.5; cursor:not-allowed}
  .pct-slider::-webkit-slider-thumb{-webkit-appearance:none; appearance:none; width:20px; height:20px; border-radius:50%; background:var(--brand); box-shadow:0 1px 4px rgba(0,0,0,.28); cursor:pointer}
  .pct-slider::-moz-range-thumb{width:20px; height:20px; border:none; border-radius:50%; background:var(--brand); cursor:pointer}
  .split-summary{display:flex; justify-content:space-between; align-items:baseline; padding:12px 14px; border-radius:var(--r-sm);
    background:var(--canvas); font-size:13.5px; margin-top:8px}
  .split-summary.bad{background:var(--neg-soft); color:#A8392F}
  .split-summary.good{background:var(--pos-soft); color:#0F7A4E}
  .split-summary .v{font-family:var(--display); font-weight:700; font-size:16px}

  .upload{display:flex; align-items:center; gap:12px; padding:14px; border:1.5px dashed var(--line); border-radius:var(--r-sm);
    background:#fafbfc; cursor:pointer; transition:.15s}
  .upload:hover{border-color:var(--brand); background:#0E7C6608}
  .upload .ic{width:38px; height:38px; border-radius:10px; background:var(--canvas); display:grid; place-items:center; flex:none}
  .upload .t{font-size:13.5px; font-weight:600}
  .upload .s{font-size:12px; color:var(--faint)}
  .receipt-prev{display:flex; align-items:center; gap:10px; margin-top:10px; font-size:13px; background:var(--canvas); padding:8px 10px; border-radius:10px}
  .receipt-prev img{width:44px; height:44px; object-fit:cover; border-radius:8px}

  /* ---------- Balances ---------- */
  .overall{padding:22px 20px; border-radius:var(--r-lg); color:#fff; margin-bottom:18px; position:relative; overflow:hidden}
  .overall.pos{background:linear-gradient(135deg,#15A06A,#0E7C66)}
  .overall.neg{background:linear-gradient(135deg,#E5564B,#C53A30)}
  .overall.zero{background:linear-gradient(135deg,#3A4250,#272D38)}
  .overall .lbl{font-size:13px; opacity:.85; font-weight:500}
  .overall .big{font-family:var(--display); font-weight:700; font-size:42px; letter-spacing:-.03em; line-height:1.1; margin-top:4px}
  .overall .sub{font-size:13px; opacity:.85; margin-top:6px}
  .overall::after{content:""; position:absolute; right:-40px; top:-40px; width:160px; height:160px; border-radius:50%; background:rgba(255,255,255,.08)}

  .bal-row{display:flex; align-items:center; gap:13px; padding:15px 16px; border-bottom:1px solid var(--line-soft)}
  .bal-row:last-child{border-bottom:none}
  .bal-info{flex:1; min-width:0}
  .bal-info .nm{font-weight:600; font-size:15px}
  .bal-info .meta{font-size:12.5px; color:var(--faint)}
  .flow{height:6px; background:var(--canvas); border-radius:99px; margin-top:8px; position:relative; overflow:hidden}
  .flow .fill{position:absolute; top:0; bottom:0; border-radius:99px}
  .bal-amt{text-align:right; flex:none}
  .bal-amt .v{font-family:var(--display); font-weight:700; font-size:17px}
  .bal-amt .d{font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.04em}
  .pos-c{color:var(--pos)} .neg-c{color:var(--neg)} .zero-c{color:var(--faint)}

  /* ---------- Quick ---------- */
  .quick-grid{display:grid; grid-template-columns:1fr 1fr; gap:11px}
  .quick-btn{background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:16px; text-align:left;
    box-shadow:var(--shadow); transition:transform .08s, box-shadow .15s; position:relative}
  .quick-btn:active{transform:scale(.97)}
  .quick-btn:hover{box-shadow:var(--shadow-lg)}
  .quick-btn .emo{font-size:26px; display:block; margin-bottom:8px}
  .quick-btn .ql{font-weight:600; font-size:14.5px}
  .quick-btn .qa{font-family:var(--display); font-weight:700; font-size:18px; margin-top:3px}
  .quick-btn .qs{font-size:11.5px; color:var(--faint); margin-top:2px}
  .quick-btn .del{position:absolute; top:8px; right:8px; width:24px; height:24px; border-radius:50%; background:var(--canvas);
    display:grid; place-items:center; color:var(--muted); font-size:13px; opacity:0; transition:.15s}
  .quick-btn:hover .del{opacity:1}
  .quick-add{border:1.5px dashed var(--line); background:transparent; box-shadow:none; display:grid; place-items:center; color:var(--muted); min-height:118px; font-weight:600; font-size:14px}
  .quick-add:hover{border-color:var(--brand); color:var(--brand)}

  /* ---------- Trip ---------- */
  .trip-route{display:flex; gap:12px; align-items:stretch}
  .trip-route .pins{display:flex; flex-direction:column; align-items:center; padding-top:14px}
  .trip-route .pin{width:11px; height:11px; border-radius:50%; border:2.5px solid var(--brand)}
  .trip-route .pin.end{border-color:var(--neg); border-radius:50% 50% 50% 0; transform:rotate(45deg)}
  .trip-route .line{flex:1; width:2px; background:repeating-linear-gradient(var(--line) 0 4px, transparent 4px 8px); margin:4px 0}
  .trip-route .inputs{flex:1}
  #map{height:200px; border-radius:var(--r); margin-top:14px; border:1px solid var(--line); background:var(--canvas); z-index:0}
  .stop-dot{width:12px; height:12px; border-radius:50%; border:2.5px solid var(--brand); flex:none}
  .stop-dot.end{border-color:var(--neg); border-radius:50% 50% 50% 0; transform:rotate(45deg)}
  .stop-dot.mid{border-color:var(--muted)}
  .stop-rm{width:32px; height:32px; border-radius:9px; background:var(--canvas); color:var(--muted); font-size:13px; flex:none; display:grid; place-items:center; border:1px solid var(--line)}
  .stop-rm:active{transform:scale(.95)}
  .trip-result{display:grid; grid-template-columns:repeat(3,1fr); gap:1px; background:var(--line); border-radius:var(--r); overflow:hidden; margin-top:14px}
  .trip-result .cell{background:#fff; padding:14px 12px; text-align:center}
  .trip-result .cv{font-family:var(--display); font-weight:700; font-size:21px}
  .trip-result .cl{font-size:11px; color:var(--faint); margin-top:2px; text-transform:uppercase; letter-spacing:.05em}
  .trip-result .cell.cost .cv{color:var(--brand)}

  .veh-row{display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid var(--line-soft)}
  .veh-row:last-child{border-bottom:none}
  .veh-row .vn{font-weight:600; font-size:14.5px}
  .veh-row .vm{font-size:12.5px; color:var(--faint)}

  /* ---------- Activity ---------- */
  .act-row{display:flex; align-items:center; gap:13px; padding:14px 16px; border-bottom:1px solid var(--line-soft)}
  .act-row:last-child{border-bottom:none}
  .act-ic{width:42px; height:42px; border-radius:12px; background:var(--canvas); display:grid; place-items:center; font-size:19px; flex:none}
  .act-main{flex:1; min-width:0}
  .act-main .at{font-weight:600; font-size:14.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .act-main .am{font-size:12.5px; color:var(--faint)}
  .act-right{text-align:right; flex:none}
  .act-right .tot{font-family:var(--display); font-weight:700; font-size:15px}
  .act-right .yr{font-size:11.5px; color:var(--muted)}

  /* ---------- Tab bar ---------- */
  .tabbar{position:fixed; bottom:0; left:0; right:0; z-index:40; display:flex; justify-content:center; pointer-events:none}
  .tabbar .inner{pointer-events:auto; display:flex; gap:1px; background:rgba(24,27,35,.92); backdrop-filter:blur(12px);
    margin-bottom:max(14px,env(safe-area-inset-bottom)); padding:6px; border-radius:999px; box-shadow:var(--shadow-lg);
    max-width:calc(100vw - 16px); overflow-x:auto; scrollbar-width:none}
  .tabbar .inner::-webkit-scrollbar{display:none}
  .tab{display:flex; flex-direction:column; align-items:center; gap:3px; padding:8px 11px; border-radius:999px; color:#9AA0AC; transition:.15s; min-width:50px; flex:none}
  .tab svg{width:21px; height:21px}
  .tab span{font-size:10px; font-weight:600}
  .tab.active{background:#fff; color:var(--ink)}

  /* ---------- Login ---------- */
  .login{min-height:100dvh; display:flex; flex-direction:column; justify-content:center; padding:32px 24px; max-width:480px; margin:0 auto}
  .login .hero{text-align:center; margin-bottom:36px}
  .login .hero .mk{font-family:var(--display); font-weight:700; font-size:33px; line-height:1.1; letter-spacing:-.03em; display:inline-flex; align-items:center; gap:11px; justify-content:center}
  .login .hero .mk .dot{width:14px;height:14px;border-radius:50%;background:var(--brand);box-shadow:0 0 0 6px #0E7C661f}
  .login .hero p{color:var(--muted); margin-top:10px; font-size:15px}
  .login .who{font-size:12px; font-weight:600; letter-spacing:.12em; text-transform:uppercase; color:var(--faint); text-align:center; margin-bottom:18px}
  .who-grid{display:grid; grid-template-columns:1fr 1fr; gap:11px}
  .who-card{background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:18px 16px; display:flex; align-items:center; gap:13px;
    box-shadow:var(--shadow); transition:transform .08s, box-shadow .15s; text-align:left}
  .who-card:hover{box-shadow:var(--shadow-lg)}
  .who-card:active{transform:scale(.97)}
  .who-card .nm{font-weight:600; font-size:16px}
  .who-add{grid-column:1/-1; border:1.5px dashed var(--line); background:transparent; box-shadow:none; justify-content:center; color:var(--muted); font-weight:600; padding:15px}
  .who-add:hover{border-color:var(--brand); color:var(--brand)}

  /* ---------- Modal / sheet ---------- */

const PALETTE = ['#E5564B','#1DAA6B','#3B82F6','#F59E0B','#8B5CF6','#EC4899','#0EA5E9','#14B8A6','#F97316','#6366F1'];

const aiKey = () => (state.settings && state.settings.aiKey) || ANTHROPIC_API_KEY;

const placeResolve = txt => { const p = state.places.find(x=>x.label.toLowerCase()===String(txt||'').trim().toLowerCase()); return p ? p.address : txt; };

/* ---------------- Helpers ---------------- */
const $ = s => document.querySelector(s);

const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const initials = n => n.trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();

const avatar = (name, size='sm') => `<span class="av ${size}" style="background:${personColor(name)}">${esc(initials(name))}</span>`;
const todayISO = () => { const d=new Date(), z=n=>String(n).padStart(2,'0'); return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}`; };
const tsFromISO = iso => { if(!iso) return Date.now(); const [y,m,d]=iso.split('-').map(Number); return new Date(y,(m||1)-1,d||1,12,0,0).getTime(); };
const fmtDate = ts => new Date(ts).toLocaleDateString('en-GB',{day:'numeric',month:'short'});

/* ---- Standing orders / recurring payments ---- */
const STANDING_MARKER = '🔁 Standing order (simulated)';
const WEEKDAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const REPEATS = [
  {v:'w1', label:'Weekly',         freq:'weekly',  interval:1},
  {v:'w2', label:'Fortnightly',    freq:'weekly',  interval:2},
  {v:'w4', label:'Every 4 weeks',  freq:'weekly',  interval:4},
  {v:'m1', label:'Monthly',        freq:'monthly', interval:1},
  {v:'m2', label:'Every 2 months', freq:'monthly', interval:2},
  {v:'m3', label:'Quarterly',      freq:'monthly', interval:3},
  {v:'m6', label:'Every 6 months', freq:'monthly', interval:6},
  {v:'m12',label:'Yearly',         freq:'monthly', interval:12},
];
const repeatOf = v => REPEATS.find(x=>x.v===v) || REPEATS[3];
const repeatV = r => { const x=REPEATS.find(x=>x.freq===r.freq && x.interval===r.interval); return x?x.v:(r.freq==='weekly'?'w1':'m1'); };
const isoOf = d => { const z=n=>String(n).padStart(2,'0'); return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}`; };
const parseISO = s => new Date(s+'T12:00:00');
const addDays = (d,n)=>{ const x=new Date(d); x.setDate(x.getDate()+n); return x; };
const daysInMonth = (y,m)=> new Date(y,m+1,0).getDate();
function addMonths(y,m,n){ let mm=m+n, yy=y+Math.floor(mm/12); mm=((mm%12)+12)%12; return [yy,mm]; }
function domDate(y,m,dom){ const dim=daysInMonth(y,m); return new Date(y,m, dom===0?dim:Math.min(dom,dim), 12); }
function nthWeekdayOfMonth(y,m,pos,weekday){
  if(pos===0){ let d=new Date(y,m,daysInMonth(y,m),12); while(d.getDay()!==weekday) d=addDays(d,-1); return d; }
  let d=new Date(y,m,1,12), count=0;
  while(d.getMonth()===m){ if(d.getDay()===weekday){ count++; if(count===pos) return d; } d=addDays(d,1); }
  return nthWeekdayOfMonth(y,m,0,weekday);
}
function monthlyOccurrence(y,m,rule){ return rule.dayMode==='dow' ? nthWeekdayOfMonth(y,m,rule.weekPos,rule.weekday) : domDate(y,m,rule.dayOfMonth); }
function firstDue(rule, floor){
  floor = floor || rule.start;
  if(rule.freq==='weekly'){ let d=parseISO(rule.start); let guard=0; while(isoOf(d)<floor && guard++<520) d=addDays(d,7*(rule.interval||1)); return isoOf(d); }
  let b=parseISO(rule.start), y=b.getFullYear(), m=b.getMonth(), occ=monthlyOccurrence(y,m,rule), guard=0;
  while(isoOf(occ)<floor && guard++<240){ [y,m]=addMonths(y,m,rule.interval||1); occ=monthlyOccurrence(y,m,rule); }
  return isoOf(occ);
}
function advanceRule(rule){
  if(rule.endMode==='count' && (rule.runsDone+1) >= rule.endCount) return null;
  const cur=parseISO(rule.nextDue); let nextIso;
  if(rule.freq==='weekly'){ nextIso=isoOf(addDays(cur,7*(rule.interval||1))); }
  else { let [y,m]=addMonths(cur.getFullYear(),cur.getMonth(),rule.interval||1); nextIso=isoOf(monthlyOccurrence(y,m,rule)); }
  if(rule.endMode==='date' && rule.endDate && nextIso>rule.endDate) return null;
  return nextIso;
}
const ordinal = n => { const s=['th','st','nd','rd'], v=n%100; return n+(s[(v-20)%10]||s[v]||s[0]); };
function repeatLabel(freq,interval){
  if(freq==='weekly') return interval===1?'weekly':interval===2?'fortnightly':`every ${interval} weeks`;
  return interval===1?'monthly':interval===3?'quarterly':interval===12?'yearly':`every ${interval} months`;
}
function dayRuleLabel(r){
  if(r.freq==='weekly') return 'on '+WEEKDAYS[r.weekday!=null?r.weekday:parseISO(r.start).getDay()];
  if(r.dayMode==='dow'){ const pos=r.weekPos===0?'last':ordinal(r.weekPos); return `on the ${pos} ${WEEKDAYS[r.weekday]}`; }
  return `on the ${r.dayOfMonth===0?'last day':ordinal(r.dayOfMonth)}`;
}
function fmtLong(iso){ if(!iso) return ''; const d=parseISO(iso); return d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}); }
function ruleSummary(r){ return `${repeatLabel(r.freq,r.interval)}, ${dayRuleLabel(r)}`; }
function ruleObj(rc){ const r=repeatOf(rc.repeat); return { freq:r.freq, interval:r.interval, dayMode:rc.dayMode, dayOfMonth:rc.dayOfMonth, weekPos:rc.weekPos, weekday: r.freq==='weekly'?parseISO(rc.start).getDay():rc.weekday, start:rc.start, endMode:rc.endMode, endDate:rc.endDate, endCount:rc.endCount, runsDone:0, nextDue:null }; }
// true when an expense/transfer creates a debt between a and b
const involvesPair = (x,a,b) => { const sp=x.split||{}; return (x.paidBy===a && sp[b]!=null) || (x.paidBy===b && sp[a]!=null); };

/* ---------------- Backend (Supabase) ---------------- */
const normSplit = v => (Array.isArray(v) ? v : 'all');
function ruleFromPayload(p){ return { freq:p.freq, interval:p.interval, dayMode:p.dayMode, dayOfMonth:p.dayOfMonth, weekPos:p.weekPos, weekday:p.weekday, start:p.start, endMode:p.endMode, endDate:p.endDate, endCount:p.endCount, runsDone:0, nextDue:null }; }

// Apply any standing orders that have come due — one run per rule, once per app open.
let standingProcessed = false;
async function runDueStandingOrders(){
  if(standingProcessed || !connected || !sb) return;
  standingProcessed = true;
  const today = todayISO();
  let created = 0;
  for(const r of (state.recurring||[])){
    if(!r.active || !r.nextDue || r.nextDue > today) continue;
    const next = advanceRule(r);
    const claim = await sb.from('recurring').update({ next_due: next, runs_done:(r.runsDone||0)+1, active: !!next }).eq('id', r.id).eq('next_due', r.nextDue).select();
    if(claim.data && claim.data.length){
      try{
        await api('addExpense', { name:`${r.from} → ${r.to}`, total:r.amount, paidBy:r.from, split:{[r.to]:r.amount}, type:'transfer', description:STANDING_MARKER, ts: tsFromISO(r.nextDue) });
        created++;
      }catch(e){}
    }
  }
  if(created){ await refresh(); toast(`${created} standing order${created>1?'s':''} applied`); }
}

async function fetchAllData(){
  const [pe,ve,qe,qt,pl,ex,se,rc] = await Promise.all([

    recurring: (rc.data||[]).map(r=>({ id:r.id, from:r.from_person, to:r.to_person, amount:Number(r.amount)||0, freq:r.freq, interval:Number(r.interval)||1, dayMode:r.day_mode, dayOfMonth:r.day_of_month, weekPos:r.week_pos, weekday:r.weekday, start:r.start_date, endMode:r.end_mode, endDate:r.end_date, endCount:r.end_count, nextDue:r.next_due, runsDone:Number(r.runs_done)||0, active:r.active!==false })),
    settings: { fuelPence:Number(S.fuelPence)||156, ntfyBase:S.ntfyBase||'', ntfyServer:S.ntfyServer||'https://ntfy.sh', ntfyToken:S.ntfyToken||'', ntfyTokenSet: !!S.ntfyToken, aiKey:S.aiKey||'', aiKeySet: !!S.aiKey }
  };
}
function sbThrow(error){ if(error) throw new Error(error.message||'Supabase error'); }

async function uploadReceipt(r){
  const bytes = Uint8Array.from(atob(r.data), c=>c.charCodeAt(0));
  const blob = new Blob([bytes], {type:r.mimeType||'application/octet-stream'});
  const path = Date.now()+'_'+Math.random().toString(36).slice(2)+'_'+String(r.name||'receipt').replace(/[^\w.\-]/g,'_');
  const up = await sb.storage.from('receipts').upload(path, blob, {contentType:r.mimeType, upsert:false});
  sbThrow(up.error);
  return sb.storage.from('receipts').getPublicUrl(path).data.publicUrl;
}

/* ntfy — sent straight from the browser (your own IP, so no shared-IP limit) */
async function ntfySend(list){

async function notifyForExpense(info){
  const base = state.settings && state.settings.ntfyBase; if(!base) return;

  } else {

      list.push({topic:personTopic(p), title:'New '+label, message:`${info.paidBy} added "${info.name}" — £${Number(info.total).toFixed(2)} total. Your share: £${share.toFixed(2)}.`, tags:tag}); });
  }
  if(list.length) await ntfySend(list);
}

/* trip distance — keyless geocoding (Nominatim) + routing (OSRM) */
const geoCache = {};
async function geocode(q){
  if(geoCache[q]) return geoCache[q];
  const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${encodeURIComponent(q)}`, {headers:{'Accept':'application/json'}});
  const j = await res.json();
  if(!j.length) throw new Error(`Couldn't find "${q}" on the map — try a postcode.`);
  const c = {lat:Number(j[0].lat), lng:Number(j[0].lon)}; geoCache[q]=c; return c;
}
async function calcTripClient(payload){
  let stops=[];
  if(payload.stops && payload.stops.length) stops = payload.stops.map(s=>String(s||'').trim()).filter(Boolean);
  else { const o=String(payload.origin||'').trim(), d=String(payload.destination||'').trim(); if(o)stops.push(o); if(d)stops.push(d); if(payload.roundTrip&&o)stops.push(o); }
  if(stops.length<2) throw new Error('Enter a start and at least one more stop.');
  const mpg=Number(payload.mpg); if(!(mpg>0)) throw new Error('Enter the vehicle MPG.');
  const pence=fuelPence();
  const coords=[]; for(const s of stops){ coords.push(await geocode(s)); }
  const url=`https://router.project-osrm.org/route/v1/driving/${coords.map(c=>c.lng+','+c.lat).join(';')}?overview=full&geometries=geojson`;
  const j=await (await fetch(url)).json();
  if(j.code!=='Ok'||!j.routes||!j.routes.length) throw new Error('No driving route found between those places.');
  const route=j.routes[0]; const legs=[]; let totalMiles=0;
  route.legs.forEach((leg,idx)=>{ const miles=leg.distance/1609.344; totalMiles+=miles;
    const litres=(miles/mpg)*4.54609, costExact=litres*(pence/100);
    legs.push({from:stops[idx], to:stops[idx+1], miles:Math.round(miles*10)/10, litres:Math.round(litres*100)/100, cost:Math.round(costExact*100)/100, costExact}); });
  const totalLitres=(totalMiles/mpg)*4.54609, totalCost=totalLitres*(pence/100);
  const points=coords.map(c=>[c.lat,c.lng]);
  const geo=(route.geometry&&route.geometry.coordinates)? route.geometry.coordinates.map(c=>[c[1],c[0]]) : points;
  return { stops, origin:stops[0], destination:stops[stops.length-1], legs, miles:Math.round(totalMiles*10)/10, litres:Math.round(totalLitres*100)/100, cost:Math.round(totalCost*100)/100, pence, roundTrip:!!payload.roundTrip, points, geo };
}

async function scanReceipt(image){
  const key = aiKey();
  if(!key) throw new Error('Add your Anthropic API key in Settings first.');
  const prompt = 'You are a receipt parser. Read this receipt image and return ONLY JSON — no markdown, no commentary — in exactly this shape:\n'
    + '{"merchant":string,"items":[{"name":string,"qty":number,"price":number}],"delivery":number,"service":number,"total":number}\n'
    + 'Rules: "price" is the total for that line (quantity times unit price) in pounds as a number. Combine obvious duplicates only if the receipt does. "delivery" and "service" are 0 if not present. "total" is the grand total printed on the receipt. Use plain numbers (e.g. 12.50), no currency symbols. If a value is unreadable, give your best estimate.';
  const isPdf = (image.mimeType||'').includes('pdf');
  const media = isPdf
    ? { type:'document', source:{ type:'base64', media_type:'application/pdf', data:image.data } }
    : { type:'image', source:{ type:'base64', media_type:image.mimeType||'image/jpeg', data:image.data } };
  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method:'POST',
    headers:{
      'content-type':'application/json',
      'x-api-key': key,
      'anthropic-version':'2023-06-01',
      'anthropic-dangerous-direct-browser-access':'true'
    },
    body: JSON.stringify({
      model: AI_MODEL, max_tokens: 1500,
      messages:[{ role:'user', content:[ media, { type:'text', text: prompt } ]}]
    })
  });
  if(!res.ok){ const t=await res.text(); throw new Error('AI error '+res.status+': '+t.slice(0,140)); }
  const data = await res.json();
  const text = (data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('\n');
  let clean = text.replace(/```json/gi,'').replace(/```/g,'').trim();
  let parsed;
  try{ parsed = JSON.parse(clean); }
  catch(e){ const m = clean.match(/\{[\s\S]*\}/); if(!m) throw new Error('Could not read that receipt — try a clearer photo.'); parsed = JSON.parse(m[0]); }
  if(!parsed.items || !parsed.items.length) throw new Error('No items found on that receipt.');
  return parsed;
}

// Split items among their assignees; charges split equally across everyone involved.
function computeReceiptShares(items, delivery, service, involved){
  const raw={}; involved.forEach(p=>raw[p]=0);
  items.forEach(it=>{ const who=[...(it.assignedTo||[])]; if(!who.length) return; const each=(Number(it.price)||0)/who.length; who.forEach(p=>{ if(raw[p]==null) raw[p]=0; raw[p]+=each; }); });
  const chg=(Number(delivery)||0)+(Number(service)||0);
  if(chg>0 && involved.length){ const each=chg/involved.length; involved.forEach(p=>raw[p]+=each); }
  const totalF = items.reduce((s,it)=>s+(Number(it.price)||0),0)+chg;
  const target = Math.round(totalF*100);
  const names=involved.slice();
  const cc={}; names.forEach(p=>cc[p]=Math.floor(raw[p]*100));
  const order=names.map(p=>({p,f:raw[p]*100-Math.floor(raw[p]*100)})).sort((a,b)=>b.f-a.f);
  let rem=target-names.reduce((s,p)=>s+cc[p],0),k=0;
  while(rem>0){ cc[order[k%order.length].p]+=1; rem--; k++; }
  while(rem<0){ const p=order[order.length-1-(k%order.length)].p; if(cc[p]>0){cc[p]-=1; rem++;} k++; }
  const split={}; names.forEach(p=>split[p]=cc[p]/100);
  return {split, total: target/100};
}

    case 'calcTrip': return calcTripClient(payload);
    default: throw new Error('Unknown action: '+action);

}

/* one-time importer: pull everything from the old Apps Script backend */
async function migrateFromApps(oldUrl, secret){
  const res = await fetch(oldUrl, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify({action:'getData', payload:{}, secret})});
  const out = await res.json();
  if(!out.ok) throw new Error(out.error||'Could not read the old data.');
  const d = out.data; const counts={};
  for(const p of (d.people||[])) sbThrow((await sb.from('people').upsert({name:p.name, color:p.color, active:true}, {onConflict:'name'})).error);
  counts.people=(d.people||[]).length;
  for(const v of (d.vehicles||[])) sbThrow((await sb.from('vehicles').upsert({name:v.name, mpg:v.mpg}, {onConflict:'name'})).error);
  for(const p of (d.places||[])) sbThrow((await sb.from('places').upsert({label:p.label, address:p.address}, {onConflict:'label'})).error);
  for(const q of (d.quick||[])) sbThrow((await sb.from('quick_expenses').upsert({label:q.label, emoji:q.emoji, amount:q.amount, description:q.description, split:q.split==='all'?'all':q.split}, {onConflict:'label'})).error);
  for(const q of (d.quickTrips||[])) sbThrow((await sb.from('quick_trips').upsert({label:q.label, emoji:q.emoji, origin:q.origin, destination:q.destination, vehicle:q.vehicle, mpg:q.mpg, round_trip:q.roundTrip, split:q.split==='all'?'all':q.split}, {onConflict:'label'})).error);
  for(const x of (d.expenses||[])) sbThrow((await sb.from('expenses').upsert({id:x.id, ts:new Date(x.ts).toISOString(), name:x.name, description:x.description, paid_by:x.paidBy, total:x.total, type:x.type, split:x.split, receipt_url:x.receiptUrl, tag:x.tag||''}, {onConflict:'id'})).error);
  counts.expenses=(d.expenses||[]).length;
  if(d.settings && d.settings.fuelPence) sbThrow((await sb.from('settings').upsert({key:'fuelPence', value:String(d.settings.fuelPence)})).error);
  if(d.settings && d.settings.ntfyBase) sbThrow((await sb.from('settings').upsert({key:'ntfyBase', value:d.settings.ntfyBase})).error);
  return counts;
}
function applyData(d){
  if(!d) return;
  state.people = d.people && d.people.length ? d.people : state.people;
  state.vehicles = d.vehicles || [];
  state.quick = d.quick || [];
  state.quickTrips = d.quickTrips || [];
  if(d.places) state.places = d.places;
  if(d.settings) state.settings = d.settings;
  state.expenses = (d.expenses||[]).sort((a,b)=>b.ts-a.ts);
  state.recurring = d.recurring || [];
  if(state.me && !state.people.some(p=>p.name===state.me)) state.me = null;
}
async function refresh(){
  if(!connected) return;
  try{ state.loading=true; const d = await api('getData'); state.connected=true; applyData(d); }
  catch(e){ state.connected=false; toast(e.message,'err'); }
  finally{ state.loading=false; renderAll(); runDueStandingOrders(); }
}

/* ---------------- Balance maths ---------------- */
function computeBalances(){
  // debt[a][b] = how much a owes b
  const debt = {};
  state.people.forEach(p=>{ debt[p.name]={}; });
  state.expenses.forEach(x=>{
    const payer = x.paidBy;
    Object.keys(x.split||{}).forEach(person=>{
      if(person===payer) return;
      if(!debt[person]) debt[person]={};
      debt[person][payer] = (debt[person][payer]||0) + (Number(x.split[person])||0);
    });
  });
  // net for me vs each other person
  const me = state.me;
  const rows = [];
  state.people.filter(p=>p.name!==me).forEach(p=>{
    const o = p.name;
    const theyOweMe = (debt[o] && debt[o][me]) || 0;
    const iOweThem  = (debt[me] && debt[me][o]) || 0;
    const net = theyOweMe - iOweThem; // >0 they owe me
    rows.push({name:o, net});
  });
  const overall = rows.reduce((s,r)=>s+r.net,0);
  return {rows, overall};
}

  if(state.people.length>1){
    const btns = el('div'); btns.style.cssText='display:flex;gap:10px;margin-bottom:18px';
    const pay = el('button','btn btn-ghost','💸  Record a payment'); pay.style.flex='1';
    pay.onclick = ()=>transferSheet({});
    const so = el('button','btn btn-ghost','🔁  Standing orders'); so.style.flex='1';
    so.onclick = ()=>standingOrdersSheet();
    btns.appendChild(pay); btns.appendChild(so);
    wrap.appendChild(btns);
  }
  wrap.appendChild(el('div','section-eyebrow','Person by person'));
  const list = el('div','card');
  const sorted = rows.slice().sort((a,b)=>Math.abs(b.net)-Math.abs(a.net));
  if(!sorted.length){
    list.appendChild(emptyState('🫶','Just you so far','Add more people to start splitting.'));
  } else {
    const max = Math.max(1, ...sorted.map(r=>Math.abs(r.net)));
    sorted.forEach(r=>{
      const row = el('div','bal-row');
      const settled = Math.abs(r.net)<0.01;
      const dir = settled?'zero':(r.net>0?'pos':'neg');
      const pct = Math.min(100, (Math.abs(r.net)/max)*100);
      const fill = dir==='zero' ? '' :
        (dir==='pos'
          ? `<div class="fill" style="left:50%;width:${pct/2}%;background:var(--pos)"></div>`
          : `<div class="fill" style="right:50%;width:${pct/2}%;background:var(--neg)"></div>`);
      row.innerHTML = `
        ${avatar(r.name,'md')}
        <div class="bal-info">
          <div class="nm">${esc(r.name)}</div>
          <div class="meta">${settled?'Settled up':(r.net>0?'owes you':'you owe')}</div>
          <div class="flow"><div class="fill" style="left:50%;width:1px;background:var(--line)"></div>${fill}</div>
        </div>
        <div class="bal-amt">
          <div class="v ${dir==='pos'?'pos-c':dir==='neg'?'neg-c':'zero-c'} num">${settled?'—':money(Math.abs(r.net))}</div>
          <div class="d ${dir==='pos'?'pos-c':dir==='neg'?'neg-c':'zero-c'}">${settled?'':(r.net>0?'owed':'you owe')}</div>
        </div>`;
      row.onclick = ()=>personDetailSheet(r.name);
      list.appendChild(row);
    });
  }
  wrap.appendChild(list);
  return wrap;
}

function personDetailSheet(other){
  const linked = state.expenses.filter(x=>involvesPair(x,state.me,other));
  const net = computeBalances().rows.find(r=>r.name===other);
  const netVal = net ? net.net : 0;
  openSheet(s=>{
    s.appendChild(el('h2',null,`You & ${esc(other)}`));
    const settled = Math.abs(netVal)<0.01;
    s.appendChild(el('p','desc', settled ? 'You’re all settled up.' :
      (netVal>0 ? `${esc(other)} owes you ${money(netVal)}.` : `You owe ${esc(other)} ${money(-netVal)}.`)));

    // Settle-up shortcut, prefilled
    const pay = el('button','btn btn-primary btn-block', settled ? '💸  Record a payment' :
      (netVal<0 ? `💸  Pay ${esc(other)} ${money(-netVal)}` : `💸  Record ${esc(other)} paying you`));
    pay.style.marginBottom='16px';
    pay.onclick = ()=>{ closeSheet(); transferSheet({other, dir: netVal<0?'out':'in', amount: settled?'':Math.abs(netVal).toFixed(2)}); };
    s.appendChild(pay);

    if(!linked.length){ s.appendChild(emptyState('🧾','Nothing between you yet','No expenses or payments link you two so far.')); return; }
    s.appendChild(el('div','section-eyebrow','History'));
    const list = el('div','card'); list.style.marginBottom='8px';
    linked.forEach(x=>{
      const youPaid = x.paidBy===state.me;
      const amt = youPaid ? (x.split[other]||0) : (x.split[state.me]||0);
      const isT = x.type==='transfer';
      const label = isT ? (youPaid?'You paid '+esc(other):esc(other)+' paid you')
                        : (youPaid?'You paid · they owe':'They paid · you owe');
      const row = el('div','act-row');
      row.innerHTML = `<div class="act-ic">${typeIcon(x)}</div>
        <div class="act-main"><div class="at">${esc(x.name)}</div>
        <div class="am">${label} · ${fmtDate(x.ts)}</div></div>
        <div class="act-right"><div class="tot num ${youPaid?'pos-c':'neg-c'}">${youPaid?'+':'−'}${money(amt)}</div></div>`;
      list.appendChild(row);
    });
    s.appendChild(list);
  });
}

/* ---- Record a payment / transfer ---- */
function transferSheet(opts){
  opts = opts || {};
  const fs = { dir: opts.dir || 'out', other: opts.other || null, date: todayISO() };
  openSheet(s=>{
    s.appendChild(el('h2',null,'Record a payment'));
    s.appendChild(el('p','desc','Money sent directly to settle up — it counts against what’s owed.'));

    const dirF = el('div','field');
    dirF.innerHTML = `<label>Direction</label>
      <div class="seg" id="trDir">
        <button data-d="out" class="${fs.dir==='out'?'active':''}">You paid</button>
        <button data-d="in" class="${fs.dir==='in'?'active':''}">You were paid</button>
      </div>`;
    s.appendChild(dirF);

    const whoF = el('div','field'); whoF.innerHTML = `<label id="whoLbl"></label><div class="people-grid" id="trWho"></div>`;
    s.appendChild(whoF);

    const amtF = el('div','field');
    amtF.innerHTML = `<label>Amount</label><div class="money-input"><span class="sym">£</span>
      <input class="input" id="trAmt" type="number" inputmode="decimal" step="0.01" placeholder="0.00" value="${esc(opts.amount||'')}"></div>`;
    s.appendChild(amtF);

    const dateF = el('div','field');
    dateF.innerHTML = `<label>Date</label><input class="input" id="trDate" type="date" value="${fs.date}" max="${todayISO()}">`;
    s.appendChild(dateF);

    const noteF = el('div','field');
    noteF.innerHTML = `<label>Note <span class="hint">optional</span></label><input class="input" id="trNote" placeholder="e.g. bank transfer">`;
    s.appendChild(noteF);

    const btn = el('button','btn btn-primary btn-block','Record payment');
    s.appendChild(btn);

    function drawWho(){
      whoF.querySelector('#whoLbl').textContent = fs.dir==='out' ? 'Paid to' : 'Received from';
      const g = whoF.querySelector('#trWho'); g.innerHTML='';
      state.people.filter(p=>p.name!==state.me).forEach(p=>{
        const b = el('button','pchip'+(fs.other===p.name?' on':''));
        b.innerHTML = `${avatar(p.name,'sm')}${esc(p.name)}<span class="tick">✓</span>`;
        b.onclick = ()=>{ fs.other=p.name; drawWho(); };
        g.appendChild(b);
      });
    }
    drawWho();
    dirF.querySelector('#trDir').addEventListener('click', e=>{
      const b=e.target.closest('button'); if(!b) return; fs.dir=b.dataset.d;
      [...dirF.querySelectorAll('#trDir button')].forEach(x=>x.classList.toggle('active',x===b));
      drawWho();
    });

    btn.onclick = async ()=>{
      const amount = Number(s.querySelector('#trAmt').value)||0;
      if(!fs.other) return toast('Choose a person','err');
      if(!(amount>0)) return toast('Enter an amount','err');
      const from = fs.dir==='out' ? state.me : fs.other;
      const to   = fs.dir==='out' ? fs.other : state.me;
      const note = s.querySelector('#trNote').value.trim();
      const payload = {
        name:`Payment: ${from} → ${to}`, description:note, paidBy:from, total:amount,
        split:{ [to]:amount }, type:'transfer', ts: tsFromISO(s.querySelector('#trDate').value)
      };
      btn.disabled=true; btn.innerHTML='<span class="spin"></span>';
      try{
        if(connected){ applyData(await api('addExpense',payload)); }
        else { state.expenses.unshift({id:'local_'+Date.now(),receiptUrl:'',...payload}); state.expenses.sort((a,b)=>b.ts-a.ts); }
        closeSheet(); toast('Payment recorded'); state.tab='balances'; renderAll();
      }catch(e){ toast(e.message,'err'); btn.disabled=false; btn.innerHTML='Record payment'; }
    };
  });
}

function recurringEditorSheet(existing){
  const rc = existing ? {
    id:existing.id, from:existing.from, to:existing.to, amount:existing.amount,
    repeat:repeatV(existing), dayMode:existing.dayMode||'dow', dayOfMonth:existing.dayOfMonth||1,
    weekPos:existing.weekPos!=null?existing.weekPos:3, weekday:existing.weekday!=null?existing.weekday:0,
    start:existing.start, endMode:existing.endMode||'never', endDate:existing.endDate||'', endCount:existing.endCount||12
  } : {
    id:null, from:state.me, to:null, amount:'', repeat:'m1', dayMode:'dow', dayOfMonth:1, weekPos:3, weekday:0,
    start:todayISO(), endMode:'never', endDate:'', endCount:12
  };
  function deriveFromStart(){ const d=parseISO(rc.start); rc.dayOfMonth=d.getDate(); rc.weekday=d.getDay(); rc.weekPos=Math.min(4,Math.ceil(d.getDate()/7)); }
  if(!existing) deriveFromStart();

  openSheet(s=>{
    s.appendChild(el('h2',null, existing?'Edit standing order':'New standing order'));
    s.appendChild(el('p','desc','Enter exactly what your bank shows. It runs automatically on each date — no real money moves.'));
    const box=el('div'); s.appendChild(box);
    function render(){
      box.innerHTML='';
      const ft=el('div','field'); ft.innerHTML=`<label>Payment to <span class="hint">from you (${esc(rc.from)})</span></label><div class="people-grid" id="rcTo"></div>`;
      box.appendChild(ft);
      const gto=ft.querySelector('#rcTo');
      state.people.filter(p=>p.name!==rc.from).forEach(p=>{ const b=el('button','pchip'+(rc.to===p.name?' on':''));
        b.innerHTML=`${avatar(p.name,'sm')}${esc(p.name)}<span class="tick">✓</span>`;
        b.onclick=()=>{ rc.to=p.name; render(); }; gto.appendChild(b); });

      const amt=el('div','field'); amt.innerHTML=`<label>Amount</label><div class="money-input"><span class="sym">£</span><input class="input" id="rcAmt" type="number" step="0.01" inputmode="decimal" placeholder="0.00" value="${rc.amount!==''?rc.amount:''}" style="padding-left:30px;font-family:var(--display);font-size:18px;font-weight:600"></div>`;
      box.appendChild(amt); amt.querySelector('#rcAmt').oninput=e=>rc.amount=e.target.value;

      const rep=el('div','field'); rep.innerHTML=`<label>Repeats</label><select class="input" id="rcRep">${REPEATS.map(x=>`<option value="${x.v}" ${rc.repeat===x.v?'selected':''}>${x.label}</option>`).join('')}</select>`;
      box.appendChild(rep); rep.querySelector('#rcRep').onchange=e=>{ rc.repeat=e.target.value; render(); };
      const rObj=repeatOf(rc.repeat);

      const st=el('div','field'); st.innerHTML=`<label>Start date <span class="hint">first payment</span></label><input class="input" id="rcStart" type="date" min="${todayISO()}" value="${rc.start}">`;
      box.appendChild(st); st.querySelector('#rcStart').onchange=e=>{ rc.start=e.target.value; deriveFromStart(); render(); };

      if(rObj.freq==='monthly'){
        const on=el('div','field'); on.innerHTML=`<label>On</label>
          <div class="seg" id="rcMode"><button data-m="dow" class="${rc.dayMode==='dow'?'active':''}">A weekday</button><button data-m="dom" class="${rc.dayMode==='dom'?'active':''}">A date</button></div>
          <div id="rcOn" style="margin-top:10px"></div>`;
        box.appendChild(on);
        on.querySelector('#rcMode').onclick=e=>{ const b=e.target.closest('button'); if(!b)return; rc.dayMode=b.dataset.m; render(); };
        const onBox=on.querySelector('#rcOn');
        if(rc.dayMode==='dow'){
          onBox.innerHTML=`<div style="display:flex;gap:8px">
            <select class="input" id="rcPos">${[['1','1st'],['2','2nd'],['3','3rd'],['4','4th'],['0','last']].map(([v,l])=>`<option value="${v}" ${String(rc.weekPos)===v?'selected':''}>${l}</option>`).join('')}</select>
            <select class="input" id="rcWd">${WEEKDAYS.map((w,i)=>`<option value="${i}" ${rc.weekday===i?'selected':''}>${w}</option>`).join('')}</select></div>`;
          onBox.querySelector('#rcPos').onchange=e=>rc.weekPos=Number(e.target.value);
          onBox.querySelector('#rcWd').onchange=e=>rc.weekday=Number(e.target.value);
        } else {
          onBox.innerHTML=`<select class="input" id="rcDom">${Array.from({length:31},(_,i)=>i+1).map(d=>`<option value="${d}" ${rc.dayOfMonth===d?'selected':''}>${ordinal(d)}</option>`).join('')}<option value="0" ${rc.dayOfMonth===0?'selected':''}>last day</option></select>`;
          onBox.querySelector('#rcDom').onchange=e=>rc.dayOfMonth=Number(e.target.value);
        }
      }

      const end=el('div','field'); end.innerHTML=`<label>Ends</label>
        <div class="seg" id="rcEnd"><button data-e="never" class="${rc.endMode==='never'?'active':''}">Never</button><button data-e="date" class="${rc.endMode==='date'?'active':''}">On date</button><button data-e="count" class="${rc.endMode==='count'?'active':''}">After N</button></div>
        <div id="rcEndDetail" style="margin-top:10px"></div>`;
      box.appendChild(end);
      end.querySelector('#rcEnd').onclick=e=>{ const b=e.target.closest('button'); if(!b)return; rc.endMode=b.dataset.e; render(); };
      const edet=end.querySelector('#rcEndDetail');
      if(rc.endMode==='date'){ edet.innerHTML=`<input class="input" id="rcEndDate" type="date" min="${rc.start}" value="${rc.endDate||''}">`; edet.querySelector('#rcEndDate').onchange=e=>rc.endDate=e.target.value; }
      else if(rc.endMode==='count'){ edet.innerHTML=`<input class="input" id="rcEndCount" type="number" min="1" step="1" value="${rc.endCount||12}"><div class="hint" style="margin-top:6px">Total number of payments</div>`; edet.querySelector('#rcEndCount').oninput=e=>rc.endCount=Number(e.target.value)||1; }

      const rule=ruleObj(rc); const nd=firstDue(rule, rc.start);
      const prev=el('div','split-summary good'); prev.innerHTML=`<span>First payment ${fmtLong(nd)}</span><span class="v num">${rc.amount?money(Number(rc.amount)):''}</span>`;
      box.appendChild(prev);

      const btn=el('button','btn btn-primary btn-block', existing?'Review & save':'Review & set up'); btn.style.marginTop='6px';
      btn.onclick=()=>confirmRecurring(rc, existing);
      box.appendChild(btn);

      if(existing){
        const del=el('button','btn btn-block','Delete this standing order');
        del.style.cssText='margin-top:10px;color:var(--neg);background:var(--neg-soft)';
        del.onclick=async ()=>{ del.disabled=true; del.innerHTML='<span class="spin"></span>'; try{ applyData(await api('deleteRecurring',{id:existing.id})); closeSheet(); toast('Standing order deleted'); renderAll(); }catch(e){ toast(e.message,'err'); del.disabled=false; del.textContent='Delete this standing order'; } };
        box.appendChild(el('div',null,'<div style="font-size:12px;color:var(--faint);text-align:center;margin-top:10px">Deleting stops future runs — payments already made stay in history.</div>'));
        box.appendChild(del);
      }
    }
    render();
  });
}

function confirmRecurring(rc, existing){
  if(!rc.to) return toast('Choose who it goes to','err');
  if(rc.from===rc.to) return toast('From and to must be different','err');
  if(!(Number(rc.amount)>0)) return toast('Enter an amount','err');
  if(rc.start < todayISO()) return toast('Start date must be today or later','err');
  const r=ruleObj(rc);
  openSheet(s=>{
    s.appendChild(el('h2',null,'Before you set this up'));
    const warn=el('div','note'); warn.style.cssText='background:#FCEBE9;border:1px solid #E5564B55;margin-top:2px';
    warn.innerHTML=`<span class="ni">⚠️</span><span><b>This does not move any real money.</b> It only simulates the payment in the app on each date. Make sure the real standing order or direct debit is set up in your bank, keep an eye that balances change as you expect, and if you ever cancel the real one, delete it here too.</span>`;
    s.appendChild(warn);
    const sumC=el('div','card'); sumC.style.cssText='padding:16px;margin:14px 0;text-align:center';
    sumC.innerHTML=`<div class="num" style="font-size:28px;font-weight:700">${money(Number(rc.amount))}</div>
      <div style="margin-top:6px;font-weight:600">${esc(rc.from)} → ${esc(rc.to)}</div>
      <div style="color:var(--muted);font-size:13px;margin-top:4px">${ruleSummary(r)}</div>
      <div style="color:var(--faint);font-size:12.5px;margin-top:3px">from ${fmtLong(firstDue(r, rc.start))}${rc.endMode==='date'?' until '+fmtLong(rc.endDate):rc.endMode==='count'?` · ${rc.endCount} payments`:' · no end date'}</div>`;
    s.appendChild(sumC);
    const btn=el('button','btn btn-primary btn-block','I understand — set it up');
    btn.onclick=async ()=>{
      btn.disabled=true; btn.innerHTML='<span class="spin"></span>';
      const payload={ id:rc.id, from:rc.from, to:rc.to, amount:Number(rc.amount), freq:r.freq, interval:r.interval, dayMode:r.dayMode, dayOfMonth:r.dayOfMonth, weekPos:r.weekPos, weekday:r.weekday, start:rc.start, endMode:rc.endMode, endDate:rc.endMode==='date'?rc.endDate:null, endCount:rc.endMode==='count'?rc.endCount:null };
      try{ applyData(await api(existing?'updateRecurring':'addRecurring', payload)); closeSheet(); toast(existing?'Standing order updated':'Standing order set up'); renderAll(); }
      catch(e){ toast(e.message,'err'); btn.disabled=false; btn.innerHTML='I understand — set it up'; }
    };
    s.appendChild(btn);
    const back=el('button','btn btn-ghost btn-block','Go back'); back.style.marginTop='10px';
    back.onclick=()=>recurringEditorSheet(existing);
    s.appendChild(back);
  });
}


const draft = { receipt:null };
function viewAdd(prefill){
  draft.receipt = null;
  const wrap = el('div');
  wrap.appendChild(el('div','page-title','Add an expense'));
  wrap.appendChild(el('div','page-sub','Log what was spent and split it however you like.'));

  const form = el('div');
  form.innerHTML = `
    <div class="field"><label>Name</label>
      <input class="input" id="exName" placeholder="e.g. Tesco shop" autocomplete="off" value="${esc(prefill&&prefill.name||'')}"></div>
    <div class="field"><label>Amount</label>
      <div class="money-input"><span class="sym">£</span>
      <input class="input" id="exTotal" type="number" inputmode="decimal" step="0.01" placeholder="0.00" value="${prefill&&prefill.total||''}"></div></div>
    <div class="field"><label>Date</label>
      <input class="input" id="exDate" type="date" value="${(prefill&&prefill.date)||todayISO()}" max="${todayISO()}"></div>
    <div class="field"><label>Description <span class="hint">optional</span></label>
      <textarea class="input" id="exDesc" placeholder="Anything worth noting">${esc(prefill&&prefill.description||'')}</textarea></div>
    <div class="field"><label>Tag <span class="hint">optional — group trips, holidays, nights out…</span></label>
      <input class="input" id="exTag" list="exTagList" placeholder="e.g. Lake District weekend" autocomplete="off" value="${esc(prefill&&prefill.tag||'')}">
      ${tagDatalist('exTagList')}</div>
    <div class="field"><label>Paid by</label>
      <div class="people-grid" id="paidByGrid"></div></div>
    <div class="field"><label>Split between</label>
      <div class="people-grid" id="splitGrid"></div></div>
    <div class="field"><label>How to split</label>
      <div class="seg seg-4" id="splitMode">
        <button data-m="equal" class="active">Equal</button>
        <button data-m="shares">Shares</button>
        <button data-m="exact">Exact</button>
        <button data-m="percent">Percent</button>
      </div>
      <div id="splitDetail" style="margin-top:12px"></div></div>
    <div class="field"><label>Receipt <span class="hint">optional</span></label>
      <label class="upload" for="exFile">
        <div class="ic">📎</div>
        <div><div class="t">Attach a receipt</div><div class="s">Photo or PDF — images are compressed automatically</div></div>
      </label>
      <input type="file" id="exFile" accept="image/*,application/pdf" style="display:none">
      <div id="receiptPrev"></div></div>
    <button class="btn btn-primary btn-block" id="saveExpense">Save expense</button>
  `;
  wrap.appendChild(form);

  // local form state
  const fs = {
    paidBy: prefill&&prefill.paidBy || state.me,
    selected: new Set(prefill&&prefill.split ? Object.keys(prefill.split) : state.people.map(p=>p.name)),
    mode:'equal',
    shares:{}, exact:{}, remainder:null, pct:{}, locked:{}
  };

  function drawPaidBy(){
    const g = form.querySelector('#paidByGrid'); g.innerHTML='';
    state.people.forEach(p=>{
      const b = el('button','pchip'+(fs.paidBy===p.name?' on':''));
      b.innerHTML = `${avatar(p.name,'sm')}${esc(p.name)}<span class="tick">✓</span>`;
      b.onclick = ()=>{ fs.paidBy=p.name; drawPaidBy(); drawDetail(); };
      g.appendChild(b);
    });
  }
  function drawSplit(){
    const g = form.querySelector('#splitGrid'); g.innerHTML='';
    const all = el('button','pchip'+(fs.selected.size===state.people.length?' on':''));
    all.innerHTML = `Everyone<span class="tick">✓</span>`;
    all.onclick = ()=>{
      if(fs.selected.size===state.people.length) fs.selected.clear();
      else state.people.forEach(p=>fs.selected.add(p.name));
      drawSplit(); drawDetail();
    };
    g.appendChild(all);
    state.people.forEach(p=>{
      const b = el('button','pchip'+(fs.selected.has(p.name)?' on':''));
      b.innerHTML = `${avatar(p.name,'sm')}${esc(p.name)}<span class="tick">✓</span>`;
      b.onclick = ()=>{ fs.selected.has(p.name)?fs.selected.delete(p.name):fs.selected.add(p.name); drawSplit(); drawDetail(); };
      g.appendChild(b);
    });
  }
  function initPct(){
    const names=[...fs.selected], n=names.length||1;
    const out={}; names.forEach(nm=> out[nm]=100/n); fs.pct=out; fs.locked={};
  }
  function ensurePct(){
    const names=[...fs.selected];
    const ok = Object.keys(fs.pct).length===names.length && names.every(n=>fs.pct[n]!=null);
    if(!ok) initPct();
  }
  function rebalancePct(P, v){
    const names=[...fs.selected];
    const lockedSum = names.filter(n=>n!==P && fs.locked[n]).reduce((s,n)=>s+(fs.pct[n]||0),0);
    const available = Math.max(0, 100 - lockedSum);
    v = Math.max(0, Math.min(available, v));
    const unlocked = names.filter(n=>n!==P && !fs.locked[n]);
    fs.pct[P]=v;
    if(!unlocked.length){ fs.pct[P]=available; return; }
    // split what's left evenly across the other unlocked people (fractional, so amounts stay equal to the penny)
    const each = (available - v)/unlocked.length;
    unlocked.forEach(o=> fs.pct[o]=each);
  }
  function pctAmounts(total){
    const names=[...fs.selected], cents=Math.round(total*100);
    const raw=names.map(nm=> cents*(fs.pct[nm]||0)/100), cc=raw.map(x=>Math.floor(x));
    const order=names.map((nm,i)=>({i,f:raw[i]-cc[i]})).sort((a,b)=>b.f-a.f);
    let rem=cents-cc.reduce((a,b)=>a+b,0), k=0;
    while(rem>0){ cc[order[k%order.length].i]+=1; rem--; k++; }
    while(rem<0){ const idx=order[order.length-1-(k%order.length)].i; if(cc[idx]>0){cc[idx]-=1; rem++;} k++; }
    const out={}; names.forEach((nm,i)=>out[nm]=cc[i]/100); return out;
  }
  function currentSplit(){
    const names = [...fs.selected];
    const total = Number(form.querySelector('#exTotal').value)||0;
    const cents = Math.round(total*100);
    if(fs.mode==='equal'){
      const n=names.length||1, base=Math.floor(cents/n); let rem=cents-base*n;
      const out={}; names.forEach((nm,i)=>out[nm]=(base+(i<rem?1:0))/100);
      return {split:out, total, sum:total, ok:names.length>0&&total>0};
    }
    if(fs.mode==='shares'){
      const w = names.map(nm=> Math.max(0, parseInt(fs.shares[nm]!=null?fs.shares[nm]:1,10)||0));
      const totalW = w.reduce((a,b)=>a+b,0);
      const out={};
      if(totalW<=0){ names.forEach(nm=>out[nm]=0); return {split:out, total, sum:0, ok:false, totalW:0}; }
      const raw = names.map((nm,i)=> cents*w[i]/totalW);
      const cc = raw.map(x=>Math.floor(x));
      let rem = cents - cc.reduce((a,b)=>a+b,0);
      const order = names.map((nm,i)=>({i, f: raw[i]-cc[i]})).sort((a,b)=>b.f-a.f);
      for(let k=0;k<rem;k++){ cc[order[k%order.length].i]+=1; }
      names.forEach((nm,i)=> out[nm]=cc[i]/100);
      return {split:out, total, sum:total, ok:names.length>0&&total>0, totalW};
    }
    if(fs.mode==='percent'){
      ensurePct();
      return {split:pctAmounts(total), total, sum:total, ok:names.length>0&&total>0};
    }
    // exact (optionally one person covers the rest)
    const out={}; let fixedSum=0;
    const rem = (fs.remainder && fs.selected.has(fs.remainder)) ? fs.remainder : null;
    names.forEach(nm=>{ if(nm===rem) return; const v=Number(fs.exact[nm])||0; out[nm]=v; fixedSum+=v; });
    if(rem){
      const remAmt = Math.round((total-fixedSum)*100)/100;
      out[rem]=remAmt;
      return {split:out, total, sum:total, fixedSum, remAmt, remainder:rem, ok:names.length>0&&total>0&&remAmt>=-0.001};
    }
    let sum=0; names.forEach(nm=> sum+=(out[nm]||0));
    return {split:out, total, sum, ok:names.length>0&&total>0&&Math.abs(sum-total)<0.011};
  }
  function drawDetail(){
    const d = form.querySelector('#splitDetail'); d.innerHTML='';
    const names = [...fs.selected];
    if(!names.length){ d.innerHTML='<div class="split-summary bad">Pick at least one person to split between.</div>'; updateSave(); return; }
    const cs = currentSplit();
    const box = el('div','card'); box.style.padding='4px 14px';

    if(fs.mode==='equal'){
      names.forEach(nm=>{
        const r = el('div','split-row');
        r.innerHTML = `${avatar(nm,'sm')}<span class="name">${esc(nm)}</span><span class="num" style="font-weight:600">${money(cs.split[nm])}</span>`;
        box.appendChild(r);
      });
      d.appendChild(box);
      const s = el('div','split-summary good');
      s.innerHTML = `<span>${names.length} ${names.length===1?'person':'people'} · equal shares</span><span class="v num">${money(cs.total)}</span>`;
      d.appendChild(s);
    }
    else if(fs.mode==='shares'){
      names.forEach(nm=>{
        const wv = fs.shares[nm]!=null?fs.shares[nm]:1;
        const r = el('div','split-row');
        r.innerHTML = `${avatar(nm,'sm')}<span class="name" style="flex:1">${esc(nm)}</span>
          <div class="stepper"><button class="st-dn" data-nm="${esc(nm)}">−</button><span class="st-v">${wv}</span><button class="st-up" data-nm="${esc(nm)}">+</button></div>
          <span class="num" style="font-weight:600;min-width:62px;text-align:right">${money(cs.split[nm]||0)}</span>`;
        box.appendChild(r);
      });
      d.appendChild(box);
      box.querySelectorAll('.st-up').forEach(b=> b.onclick=()=>{ const nm=b.dataset.nm; fs.shares[nm]=(fs.shares[nm]!=null?+fs.shares[nm]:1)+1; drawDetail(); });
      box.querySelectorAll('.st-dn').forEach(b=> b.onclick=()=>{ const nm=b.dataset.nm; fs.shares[nm]=Math.max(0,(fs.shares[nm]!=null?+fs.shares[nm]:1)-1); drawDetail(); });
      const s = el('div','split-summary '+(cs.ok?'good':'bad'));
      s.innerHTML = `<span>Proportional · ${cs.totalW||0} share${cs.totalW===1?'':'s'}</span><span class="v num">${money(cs.total)}</span>`;
      d.appendChild(s);
    }
    else if(fs.mode==='percent'){
      ensurePct();
      const refs={};
      names.forEach(nm=>{
        const row = el('div','pct-row');
        row.innerHTML = `<div class="pct-head">
            <button class="pct-lock" title="Lock this share">🔓</button>
            ${avatar(nm,'sm')}<span class="name" style="flex:1">${esc(nm)}</span>
            <span class="pct-mini"><span class="numbox"><input class="pct-in pin" type="number" inputmode="numeric" min="0" max="100" step="1"><span class="nstep"><button class="nup" type="button">▲</button><button class="ndn" type="button">▼</button></span></span>%</span>
            <span class="pct-mini">£<span class="numbox amt"><input class="pct-in ain" type="number" inputmode="decimal" min="0" step="0.01"><span class="nstep"><button class="nup" type="button">▲</button><button class="ndn" type="button">▼</button></span></span></span>
          </div>
          <input type="range" class="pct-slider" min="0" max="100" step="1" value="${fs.pct[nm]||0}">`;
        box.appendChild(row);
        const nb = row.querySelectorAll('.numbox');
        refs[nm] = {
          row, lock:row.querySelector('.pct-lock'), sl:row.querySelector('.pct-slider'),
          pin:nb[0].querySelector('input'), pinUp:nb[0].querySelector('.nup'), pinDn:nb[0].querySelector('.ndn'),
          ain:nb[1].querySelector('input'), ainUp:nb[1].querySelector('.nup'), ainDn:nb[1].querySelector('.ndn')
        };
      });
      d.appendChild(box);
      const s = el('div','split-summary good'); s.id='pctSummary'; d.appendChild(s);

      const fmtPct = p => { const r=Math.round((p||0)*10)/10; return Number.isInteger(r)?String(r):r.toFixed(1); };
      const refresh = (activeEl)=>{
        const total = Number(form.querySelector('#exTotal').value)||0;
        const amts = pctAmounts(total);
        const lockedSum = names.filter(n=>fs.locked[n]).reduce((acc,n)=>acc+(fs.pct[n]||0),0);
        const available = Math.max(0,100-lockedSum);
        names.forEach(nm=>{ const rf=refs[nm], locked=!!fs.locked[nm];
          // slider works in pennies when there's a total, so it nudges money penny by penny
          if(total>0){ rf.sl.step=1; rf.sl.max = Math.max(1, Math.round((locked?100:available)*total)); if(rf.sl!==activeEl) rf.sl.value = Math.round((fs.pct[nm]||0)*total); }
          else { rf.sl.step=1; rf.sl.max = locked?100:available; if(rf.sl!==activeEl) rf.sl.value = Math.round(fs.pct[nm]||0); }
          rf.sl.disabled=locked;
          if(rf.pin!==document.activeElement) rf.pin.value=fmtPct(fs.pct[nm]);
          if(rf.ain!==document.activeElement) rf.ain.value=(amts[nm]||0).toFixed(2);
          const amtOff = locked || !(total>0);
          rf.pin.disabled=locked; rf.ain.disabled=amtOff;
          rf.pinUp.disabled=locked; rf.pinDn.disabled=locked; rf.ainUp.disabled=amtOff; rf.ainDn.disabled=amtOff;
          rf.lock.textContent=locked?'🔒':'🔓'; rf.lock.classList.toggle('on',locked);
          rf.row.classList.toggle('locked',locked);
        });
        const nL=names.filter(n=>fs.locked[n]).length;
        s.innerHTML = `<span>Percentages · always 100%${nL?` · ${nL} locked`:''}</span><span class="v num">${money(total)}</span>`;
      };
      const total0 = ()=> Number(form.querySelector('#exTotal').value)||0;
      const bumpPct = (nm,d)=>{ if(fs.locked[nm]) return; rebalancePct(nm, (fs.pct[nm]||0)+d); refresh(); updateSave(); };
      const bumpAmt = (nm,d)=>{ if(fs.locked[nm]) return; const t=total0(); if(t<=0) return; const cur=(fs.pct[nm]||0)/100*t; rebalancePct(nm, (cur+d)/t*100); refresh(); updateSave(); };
      names.forEach(nm=>{
        const rf=refs[nm];
        rf.sl.oninput = ()=>{ if(fs.locked[nm]) return; const t=total0(); const vPct = t>0 ? Number(rf.sl.value)/t : Number(rf.sl.value); rebalancePct(nm, vPct); refresh(rf.sl); updateSave(); };
        rf.pin.onchange = ()=>{ if(fs.locked[nm]) return; rebalancePct(nm, Number(rf.pin.value)||0); refresh(); updateSave(); };
        rf.ain.onchange = ()=>{ if(fs.locked[nm]) return; const t=total0(); if(t>0) rebalancePct(nm, (Number(rf.ain.value)||0)/t*100); refresh(); updateSave(); };
        rf.pinUp.onclick=()=>bumpPct(nm,1); rf.pinDn.onclick=()=>bumpPct(nm,-1);
        rf.ainUp.onclick=()=>bumpAmt(nm,0.01); rf.ainDn.onclick=()=>bumpAmt(nm,-0.01);
        rf.lock.onclick = ()=>{ fs.locked[nm]=!fs.locked[nm]; refresh(); updateSave(); };
      });
      refresh();
    }
    else {
      names.forEach(nm=>{
        const isRem = cs.remainder===nm;
        const r = el('div','split-row');
        const amtCell = isRem
          ? `<span class="num" style="font-weight:600;min-width:70px;text-align:right">${money(cs.split[nm]||0)}</span>`
          : `<div class="money-input amt"><span class="sym" style="font-size:13px">£</span><input class="input" data-nm="${esc(nm)}" type="number" inputmode="decimal" step="0.01" placeholder="0.00" value="${fs.exact[nm]!=null?fs.exact[nm]:''}" style="padding-left:24px;font-size:15px"></div>`;
        r.innerHTML = `${avatar(nm,'sm')}<span class="name" style="flex:1">${esc(nm)}</span>
          <button class="rest-btn${isRem?' on':''}" data-nm="${esc(nm)}" title="Cover the remainder">rest</button>${amtCell}`;
        box.appendChild(r);
      });
      d.appendChild(box);
      box.querySelectorAll('input[data-nm]').forEach(inp=>{ inp.oninput=()=>{ fs.exact[inp.dataset.nm]=inp.value; updateExactSummary(currentSplit()); updateSave(); }; });
      box.querySelectorAll('.rest-btn').forEach(b=> b.onclick=()=>{ const nm=b.dataset.nm; fs.remainder = (fs.remainder===nm)?null:nm; drawDetail(); });
      const s = el('div','split-summary'); s.id='exactSummary'; d.appendChild(s);
      updateExactSummary(cs);
    }
    updateSave();
  }
  function updateExactSummary(cs){
    const s = form.querySelector('#exactSummary'); if(!s) return;
    if(cs.remainder){
      const ok = cs.remAmt>=-0.001;
      s.className = 'split-summary '+(ok?'good':'bad');
      s.innerHTML = ok
        ? `<span>${esc(cs.remainder)} covers the rest</span><span class="v num">${money(cs.remAmt)}</span>`
        : `<span>${money(-cs.remAmt)} over the total</span><span class="v num">${money(cs.fixedSum)} / ${money(cs.total)}</span>`;
    } else {
      const diff = Math.round((cs.total-cs.sum)*100)/100;
      const ok = Math.abs(diff)<0.011;
      s.className = 'split-summary '+(ok?'good':'bad');
      s.innerHTML = ok ? `<span>Adds up perfectly</span><span class="v num">${money(cs.total)}</span>`
        : diff>0 ? `<span>${money(diff)} left to assign</span><span class="v num">${money(cs.sum)} / ${money(cs.total)}</span>`
        : `<span>${money(-diff)} over the total</span><span class="v num">${money(cs.sum)} / ${money(cs.total)}</span>`;
    }
  }
  function updateSave(){
    const {ok} = currentSplit();
    form.querySelector('#saveExpense').disabled = !ok || !form.querySelector('#exName').value.trim();
  }

  form.querySelector('#splitMode').addEventListener('click', e=>{
    const btn = e.target.closest('button'); if(!btn) return;
    fs.mode = btn.dataset.m;
    [...form.querySelectorAll('#splitMode button')].forEach(b=>b.classList.toggle('active', b===btn));
    drawDetail();
  });
  form.querySelector('#exTotal').addEventListener('input', ()=>{ drawDetail(); });
  form.querySelector('#exName').addEventListener('input', updateSave);

  // receipt
  form.querySelector('#exFile').addEventListener('change', async (e)=>{
    const file = e.target.files[0]; if(!file) return;
    const prev = form.querySelector('#receiptPrev'); prev.innerHTML='<div class="receipt-prev">Processing…</div>';
    try{
      const r = await processFile(file);
      draft.receipt = r;
      prev.innerHTML = `<div class="receipt-prev">
        ${r.preview?`<img src="${r.preview}">`:'<div class="act-ic">📄</div>'}
        <div style="flex:1"><div style="font-weight:600">${esc(r.name)}</div><div style="color:var(--faint);font-size:12px">${(r.size/1024).toFixed(0)} KB</div></div>
        <button class="btn btn-ghost btn-sm" id="rmReceipt">Remove</button></div>`;
      prev.querySelector('#rmReceipt').onclick = ()=>{ draft.receipt=null; prev.innerHTML=''; form.querySelector('#exFile').value=''; };
    }catch(err){ prev.innerHTML=''; toast('Could not read that file','err'); }
  });

  form.querySelector('#saveExpense').onclick = async ()=>{
    const name = form.querySelector('#exName').value.trim();
    const total = Number(form.querySelector('#exTotal').value)||0;
    const desc = form.querySelector('#exDesc').value.trim();
    const ts = tsFromISO(form.querySelector('#exDate').value);
    const tag = form.querySelector('#exTag').value.trim();
    const {split, ok} = currentSplit();
    if(!ok || !name) return;
    const payload = { name, total, description:desc, paidBy:fs.paidBy, split, type:(prefill&&prefill.type)||'expense', ts, tag };
    if(draft.receipt) payload.receipt = { data:draft.receipt.data, name:draft.receipt.name, mimeType:draft.receipt.mimeType };
    const btn = form.querySelector('#saveExpense'); btn.disabled=true; btn.innerHTML='<span class="spin"></span>';
    try{
      if(connected){ applyData(await api('addExpense', payload)); }
      else { state.expenses.unshift({id:'local_'+Date.now(),receiptUrl:'',...payload}); state.expenses.sort((a,b)=>b.ts-a.ts); }
      toast('Expense saved'); state.tab='balances'; renderAll();
    }catch(e){ toast(e.message,'err'); btn.disabled=false; btn.innerHTML='Save expense'; }
  };

  setTimeout(()=>{ drawPaidBy(); drawSplit(); drawDetail(); },0);
  return wrap;
}

const smart = { image:null, parsed:false, items:[], delivery:0, service:0, statedTotal:0, name:'', merchant:'', paidBy:null, date:null, tag:'' };
function smartReset(){ Object.assign(smart,{image:null,parsed:false,items:[],delivery:0,service:0,statedTotal:0,name:'',merchant:'',paidBy:null,date:null,tag:''}); }
function smartInvolved(){ const s=new Set(); smart.items.forEach(it=>it.assignedTo.forEach(p=>s.add(p))); return [...s]; }
function smartAllAssigned(){ return smart.items.length>0 && smart.items.every(it=>it.assignedTo.size>0); }

function viewSmart(){
  const wrap=el('div');
  wrap.appendChild(el('div','page-title','Smart add'));
  wrap.appendChild(el('div','page-sub','Snap a receipt — I’ll read the items so you can split them line by line.'));

  if(!smart.parsed){

    const prev=card.querySelector('#scPrev');
    if(smart.image){ const isPdf=(smart.image.mimeType||'').includes('pdf');
      prev.innerHTML=`<div class="receipt-prev">${smart.image.preview?`<img src="${smart.image.preview}">`:'<div class="act-ic">📄</div>'}<div style="flex:1"><div style="font-weight:600">${isPdf?'PDF receipt':'Receipt image'}</div><div style="color:var(--faint);font-size:12px">${(smart.image.size/1024).toFixed(0)} KB</div></div></div>`; }
    card.querySelector('#scFile').addEventListener('change', async e=>{
      const f=e.target.files[0]; if(!f) return;
      prev.innerHTML='<div class="receipt-prev">Processing…</div>';
      try{ smart.image=await processFile(f); renderAll(); }catch(err){ toast('Could not read that image','err'); }
    });
    card.querySelector('#scGen').onclick=async ()=>{
      if(!smart.image) return;
      const btn=card.querySelector('#scGen'); btn.disabled=true; btn.innerHTML='<span class="spin"></span> Reading receipt…';
      try{
        const p=await scanReceipt(smart.image);
        smart.merchant=p.merchant||''; smart.name=p.merchant||'Receipt';
        smart.items=(p.items||[]).map(it=>({name:String(it.name||'Item'), qty:Number(it.qty)||1, price:Number(it.price)||0, assignedTo:new Set()}));

      }catch(e){ toast(e.message,'err'); btn.disabled=false; btn.innerHTML='✨ Generate e-receipt'; }

    return wrap;
  }

  const ed=el('div'); wrap.appendChild(ed);
  function renderEd(){
    ed.innerHTML='';

    ed.appendChild(el('div','section-eyebrow','Items — assign each one'));
    smart.items.forEach((it,idx)=>{
      const card=el('div','card'); card.style.cssText='padding:12px 14px;margin-bottom:8px';

      card.innerHTML=`<div style="display:flex;align-items:center;gap:10px;margin-bottom:9px">
          <div style="flex:1;min-width:0"><div style="font-weight:600;font-size:14.5px">${esc(it.name)}</div>${it.qty>1?`<div style="font-size:12px;color:var(--faint)">qty ${it.qty}</div>`:''}</div>
          <div class="money-input" style="width:90px"><span class="sym" style="font-size:13px">£</span><input class="input scPrice" type="number" step="0.01" inputmode="decimal" value="${(Number(it.price)||0).toFixed(2)}" style="padding-left:22px;font-size:14px"></div>
          <button class="stop-rm scDel" title="Remove">✕</button></div>
        <div class="people-grid scWho"></div>
        ${unassigned?'<div style="font-size:12px;color:var(--neg);margin-top:7px;font-weight:600">Assign this to someone →</div>':''}`;
      ed.appendChild(card);
      card.querySelector('.scPrice').onchange=e=>{ smart.items[idx].price=Number(e.target.value)||0; renderEd(); };
      card.querySelector('.scDel').onclick=()=>{ smart.items.splice(idx,1); renderEd(); };
      const g=card.querySelector('.scWho');

        b.innerHTML=`${avatar(p.name,'sm')}${esc(p.name)}<span class="tick">✓</span>`;

        g.appendChild(b); });

    addI.onclick=()=>{ smart.items.push({name:'Item', qty:1, price:0, assignedTo:new Set()}); renderEd(); };
    ed.appendChild(addI);

    ed.appendChild(el('div','section-eyebrow','Charges — split across everyone with items'));
    const ch=el('div','card'); ch.style.padding='4px 14px';
    ch.innerHTML=`
      <div class="split-row"><span class="name" style="flex:1">Delivery</span><div class="money-input" style="width:100px"><span class="sym" style="font-size:13px">£</span><input class="input" id="scDel" type="number" step="0.01" inputmode="decimal" value="${smart.delivery.toFixed(2)}" style="padding-left:22px;font-size:14px"></div></div>

    tF.querySelector('#scTag').oninput=e=>smart.tag=e.target.value;

    const involved=smartInvolved();
    const nnote=el('div','note'); nnote.innerHTML=`<span class="ni">🧾</span><span>${involved.length} ${involved.length===1?'person':'people'} involved. A ${AI_CALL_PENCE}p scan charge each is added, owed to ${esc(API_PAYER)}.</span>`; ed.appendChild(nnote);

    const sub=el('button','btn btn-primary btn-block', smartAllAssigned()?'Submit receipt':'Assign every item to submit'); sub.style.marginTop='4px';
    sub.disabled = !smartAllAssigned() || !smart.paidBy;
    sub.onclick=()=>submitReceipt(sub);

    over.onclick=()=>{ smartReset(); renderAll(); };
